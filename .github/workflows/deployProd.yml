name: Deploy API

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage para deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

  deploy:
    name: Deploy stage prod
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      APP_ENV: production
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
      SES_REGION: ${{ vars.SES_REGION }}
      ALARM_NOTIFICATION_EMAIL: ${{ vars.ALARM_NOTIFICATION_EMAIL }}
      SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-championship-production

      - name: Deploy production
        run: npm run deploy:prod
