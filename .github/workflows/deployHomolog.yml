name: Deploy homolog

on:
  push:
    branches:
      - homolog
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: E2E campeonato (DynamoDB teste)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homolog
    env:
      AWS_REGION: us-east-1
      # APP_ENV=local → JWT_SECRET (HS256) e evita carregar .env.homolog ausente no CI
      APP_ENV: local
      NODE_ENV: development
      IS_LOCAL: "true"
      LOG_LEVEL: silent
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DYNAMODB_CACHE_ENABLED: "true"
      DYNAMODB_DATA_REGION: us-east-1
      DYNAMODB_CACHE_REGION: us-east-1
      # Tabelas dedicadas de teste (nome deve conter local ou test). Nunca apontar para *-dev-* / *-prod-*.
      DYNAMODB_DATA_TABLE: ${{ vars.E2E_DYNAMODB_DATA_TABLE }}
      DYNAMODB_CACHE_TABLE: ${{ vars.E2E_DYNAMODB_CACHE_TABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validar configuração E2E
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "::error::Secret JWT_SECRET ausente no Environment homolog."
            exit 1
          fi
          if [ -z "${DYNAMODB_DATA_TABLE:-}" ] || [ -z "${DYNAMODB_CACHE_TABLE:-}" ]; then
            echo "::error::Defina as variables E2E_DYNAMODB_DATA_TABLE e E2E_DYNAMODB_CACHE_TABLE no Environment homolog (ex.: championship-management-mtg-local-data / …-local-cache)."
            exit 1
          fi
          if ! echo "$DYNAMODB_DATA_TABLE" | grep -Eqi 'local|test'; then
            echo "::error::DYNAMODB_DATA_TABLE deve conter 'local' ou 'test' (recebido: $DYNAMODB_DATA_TABLE). Não use tabelas de homolog/prod."
            exit 1
          fi
          if ! echo "$DYNAMODB_CACHE_TABLE" | grep -Eqi 'local|test'; then
            echo "::error::DYNAMODB_CACHE_TABLE deve conter 'local' ou 'test' (recebido: $DYNAMODB_CACHE_TABLE)."
            exit 1
          fi
          echo "E2E data=$DYNAMODB_DATA_TABLE cache=$DYNAMODB_CACHE_TABLE"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-championship-homolog-e2e

      - name: Run E2E leves (publicar-rodada + multi-dia)
        run: npm run test:e2e:ci

  deploy:
    name: Deploy stage dev
    needs: [test, e2e]
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AWS_REGION: us-east-1
      APP_ENV: homolog
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
      SES_REGION: ${{ secrets.SES_REGION }}
      ALARM_NOTIFICATION_EMAIL: ${{ vars.ALARM_NOTIFICATION_EMAIL }}
      SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-championship-homolog

      - name: Deploy homolog
        run: npm run deploy:dev
