name: Deploy homolog

on:
  push:
    branches:
      - homolog
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: E2E campeonato (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homolog
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      APP_ENV: local
      NODE_ENV: development
      IS_LOCAL: "true"
      LOG_LEVEL: silent
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      DYNAMODB_CACHE_ENABLED: "true"
      DYNAMODB_DATA_REGION: us-east-1
      DYNAMODB_CACHE_REGION: us-east-1
      DYNAMODB_DATA_TABLE: championship-management-mtg-ci-test-data
      DYNAMODB_CACHE_TABLE: championship-management-mtg-ci-test-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validar configuração E2E
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "::error::Secret JWT_SECRET ausente no Environment homolog."
            exit 1
          fi
          echo "E2E endpoint=$DYNAMODB_ENDPOINT data=$DYNAMODB_DATA_TABLE cache=$DYNAMODB_CACHE_TABLE"

      - name: Start DynamoDB Local
        run: |
          set -euo pipefail
          docker run -d --name dynamodb-local -p 8000:8000 \
            amazon/dynamodb-local:2.5.2 \
            -jar DynamoDBLocal.jar -sharedDb -inMemory
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000; then
              echo "DynamoDB Local pronto"
              exit 0
            fi
            sleep 1
          done
          echo "::error::DynamoDB Local não respondeu em 30s"
          docker logs dynamodb-local || true
          exit 1

      - name: Criar tabelas no DynamoDB Local
        run: node scripts/criarTabelasE2eLocal.mjs

      - name: Run E2E leves (publicar-rodada + multi-dia)
        run: npm run test:e2e:ci

  deploy:
    name: Deploy stage dev
    needs: [test, e2e]
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AWS_REGION: us-east-1
      APP_ENV: homolog
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
      SES_REGION: ${{ secrets.SES_REGION }}
      ALARM_NOTIFICATION_EMAIL: ${{ vars.ALARM_NOTIFICATION_EMAIL }}
      SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-championship-homolog

      - name: Deploy homolog
        run: npm run deploy:dev
