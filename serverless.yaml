service: championship-management-mtg

provider:
  name: aws
  runtime: nodejs22.x
  timeout: 29
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_SSM_PRIVATE_KEY_PARAM: /championship-mtg/${sls:stage}/jwt-private-key
    JWT_SSM_PUBLIC_KEY_PARAM: /championship-mtg/${sls:stage}/jwt-public-key
    ABLY_API_KEY: ${env:ABLY_API_KEY}
    CHATGPT_API_KEY: ${env:CHATGPT_API_KEY}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'https://homolog.d32mjk9mbam2cb.amplifyapp.com'}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET, ''}
    AWS_S3_REGION: ${env:AWS_S3_REGION, 'us-east-1'}
    EMAIL_USER: ${env:EMAIL_USER, ''}
    EMAIL_PASS: ${env:EMAIL_PASS, ''}
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:5173'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/championship-mtg/${sls:stage}/jwt-private-key"
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/championship-mtg/${sls:stage}/jwt-public-key"
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - !Sub "arn:aws:s3:::${env:AWS_S3_BUCKET, 'placeholder'}/*"

build:
  esbuild: false

plugins:
  # - serverless-offline

custom:
  # serverless-offline:
  #   httpPort: 4000

package:
  patterns:
    - "src/**"
    - "build/**"

functions:
  # Auth, deck, imagem e health — operações leves, sem cálculos pesados
  api-auth:
    handler: build/handler.handler
    memorySize: 256
    timeout: 15
    events:
      - http:
          path: /usuario
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /usuario/{proxy+}
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /deck
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /deck/{proxy+}
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /imagem
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /imagem/{proxy+}
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /health
          method: get
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]

  # Torneio e liga — Swiss pairing e ranking são CPU e memória intensivos
  api-torneio:
    handler: build/handler.handler
    memorySize: 512
    timeout: 29
    events:
      - http:
          path: /torneio
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /torneio/{proxy+}
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /liga
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /liga/{proxy+}
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /time
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
      - http:
          path: /time/{proxy+}
          method: any
          cors:
            origins:
              - "https://homolog.d32mjk9mbam2cb.amplifyapp.com"
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]

outputs:
  usuarioCadastrar:
    Description: "Rota de cadastro de usuários"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/cadastrar"

  usuarioLogin:
    Description: "Rota de login de usuários"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/login"

  usuarioAtualizar:
    Description: "Rota de atualizar dados do usuário"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/atualizar"

  deckCadastrar:
    Description: "Rota de cadastro de decks"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/cadastrar"

  deckListar:
    Description: "Rota de listagem de decks do usuário"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/listar"

  deckAtualizar:
    Description: "Rota de atualizar deck"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/atualizar/{id}"

  deckExcluir:
    Description: "Rota de exclusão de decks"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/excluir/{id}"

  usuarioResetSenhaSolicitar:
    Description: "Rota de solicitação de reset de senha"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/reset-senha/solicitar"

  usuarioResetSenhaConfirmar:
    Description: "Rota de confirmação de reset de senha"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/reset-senha/confirmar"
