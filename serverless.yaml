service: championship-management-mtg

provider:
  name: aws
  runtime: nodejs22.x
  timeout: 29
  apiGateway:
    # Só tipos de imagem. NÃO use "*/*" — quebra OPTIONS/CORS do API Gateway.
    binaryMediaTypes:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - application/octet-stream
  environment:
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_SSM_PRIVATE_KEY_PARAM: ${env:JWT_SSM_PRIVATE_KEY_PARAM, self:custom.jwtSsmParams.private.${sls:stage}}
    JWT_SSM_PUBLIC_KEY_PARAM: ${env:JWT_SSM_PUBLIC_KEY_PARAM, self:custom.jwtSsmParams.public.${sls:stage}}
    ABLY_API_KEY: ${env:ABLY_API_KEY}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'https://app.tiagofuguete.com.br'}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET, ''}
    AWS_S3_REGION: ${env:AWS_S3_REGION, 'us-east-1'}
    DYNAMODB_CACHE_ENABLED: ${env:DYNAMODB_CACHE_ENABLED, 'true'}
    DYNAMODB_CACHE_TABLE: ${self:custom.cacheTableName.${sls:stage}}
    DYNAMODB_CACHE_REGION: ${env:DYNAMODB_CACHE_REGION, 'us-east-1'}
    DYNAMODB_DATA_TABLE: ${self:custom.dataTableName.${sls:stage}}
    DYNAMODB_DATA_REGION: ${env:DYNAMODB_DATA_REGION, 'us-east-1'}
    DYNAMODB_CACHE_TTL_METAGAME_SECONDS: ${env:DYNAMODB_CACHE_TTL_METAGAME_SECONDS, '900'}
    DYNAMODB_CACHE_TTL_TORNEIO_SECONDS: ${env:DYNAMODB_CACHE_TTL_TORNEIO_SECONDS, '60'}
    DYNAMODB_CACHE_TTL_LISTAR_TORNEIOS_SECONDS: ${env:DYNAMODB_CACHE_TTL_LISTAR_TORNEIOS_SECONDS, '30'}
    DYNAMODB_CACHE_TTL_SEO_TORNEIO_SECONDS: ${env:DYNAMODB_CACHE_TTL_SEO_TORNEIO_SECONDS, '1800'}
    DYNAMODB_CACHE_TTL_RANKING_LIGA_SECONDS: ${env:DYNAMODB_CACHE_TTL_RANKING_LIGA_SECONDS, '300'}
    DYNAMODB_CACHE_TTL_SITE_SECONDS: ${env:DYNAMODB_CACHE_TTL_SITE_SECONDS, '300'}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'Fuguete <noreply@tiagofuguete.com.br>'}
    SES_REGION: ${env:SES_REGION, 'us-east-1'}
    FRONTEND_URL: ${env:FRONTEND_URL, self:custom.frontendUrl.${sls:stage}}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/championship-mtg/${sls:stage}/jwt-private-key"
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/championship-mtg/${sls:stage}/jwt-public-key"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource:
            - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/tiagofuguete.com.br"
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - !Sub "arn:aws:s3:::${env:AWS_S3_BUCKET, 'placeholder'}/*"
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:DescribeTable
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            - dynamodb:UpdateItem
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt CacheTable.Arn
            - !GetAtt DataTable.Arn

build:
  esbuild: false

plugins:
  # - serverless-offline

custom:
  frontendUrl:
    dev: https://app.tiagofuguete.com.br
    prod: https://app.tiagofuguete.com.br
  cacheTableName:
    dev: championship-management-mtg-dev-cache
    prod: championship-management-mtg-prod-cache
  dataTableName:
    dev: championship-management-mtg-dev-data
    prod: championship-management-mtg-prod-data
  jwtSsmParams:
    private:
      dev: /championship-mtg/dev/jwt-private-key
      prod: /championship-mtg/prod/jwt-private-key
    public:
      dev: /championship-mtg/dev/jwt-public-key
      prod: /championship-mtg/prod/jwt-public-key
  corsOrigins: &corsOrigins
    - ${env:CORS_ORIGIN, 'https://app.tiagofuguete.com.br'}
    - https://app.tiagofuguete.com.br
    - https://www.app.tiagofuguete.com.br
    - https://tiagofuguete.com.br
    - https://www.tiagofuguete.com.br
    - http://localhost:5173
  # serverless-offline:
  #   httpPort: 4000

package:
  patterns:
    - "!.env"
    - "!.env.*"
    - "src/**"
    - "build/**"

resources:
  Conditions:
    HasAlarmNotificationEmail:
      Fn::Not:
        - Fn::Equals:
            - ${env:ALARM_NOTIFICATION_EMAIL, ''}
            - ''
  Resources:
    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-alarms
        Subscription:
          Fn::If:
            - HasAlarmNotificationEmail
            - - Protocol: email
                Endpoint: ${env:ALARM_NOTIFICATION_EMAIL, ''}
            - Ref: AWS::NoValue
    CacheTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.cacheTableName.${sls:stage}}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
    DataTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.dataTableName.${sls:stage}}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    LambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-lambda-errors
        AlarmDescription: Erros nao tratados na Lambda da API
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref ApiLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic
    LambdaThrottlesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-lambda-throttles
        AlarmDescription: Invocacoes recusadas por throttling na Lambda da API
        Namespace: AWS/Lambda
        MetricName: Throttles
        Dimensions:
          - Name: FunctionName
            Value: !Ref ApiLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic
    CacheDynamoThrottlesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-cache-dynamodb-throttles
        AlarmDescription: Requisicoes limitadas na tabela DynamoDB de cache
        Namespace: AWS/DynamoDB
        MetricName: ThrottledRequests
        Dimensions:
          - Name: TableName
            Value: !Ref CacheTable
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic
    DataDynamoThrottlesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-data-dynamodb-throttles
        AlarmDescription: Requisicoes limitadas na tabela DynamoDB de dados
        Namespace: AWS/DynamoDB
        MetricName: ThrottledRequests
        Dimensions:
          - Name: TableName
            Value: !Ref DataTable
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic
    CacheErrorMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref ApiLogGroup
        FilterPattern: '{ ($.msg = "falha ao ler cache DynamoDB") || ($.msg = "falha ao gravar cache DynamoDB") || ($.msg = "falha ao remover item do cache DynamoDB") }'
        MetricTransformations:
          - MetricNamespace: ChampionshipManagementMtg/Cache
            MetricName: OperacoesComFalha
            MetricValue: '1'
            DefaultValue: 0
    CacheErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      DependsOn: CacheErrorMetricFilter
      Properties:
        AlarmName: ${self:service}-${sls:stage}-cache-errors
        AlarmDescription: Falhas de leitura, gravacao ou remocao no cache DynamoDB
        Namespace: ChampionshipManagementMtg/Cache
        MetricName: OperacoesComFalha
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmTopic
        OKActions:
          - !Ref AlarmTopic

functions:
  # Uma unica Lambda para todas as rotas. Paths explicitos para preservar CORS.
  # catch-all /{proxy+} quebrou o httpMethod/path no API Gateway + serverless-http.
  api:
    handler: build/handler.handler
    memorySize: 512
    timeout: 29
    events:
      - http:
          path: /usuario
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /usuario/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /deck
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /deck/{proxy+}
          method: any
