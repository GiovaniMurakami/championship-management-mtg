service: championship-management-mtg

provider:
  name: aws
  runtime: nodejs22.x
  timeout: 29
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    MONGODB_MAX_POOL_SIZE: ${env:MONGODB_MAX_POOL_SIZE, '1'}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_SSM_PRIVATE_KEY_PARAM: ${env:JWT_SSM_PRIVATE_KEY_PARAM, self:custom.jwtSsmParams.private.${sls:stage}}
    JWT_SSM_PUBLIC_KEY_PARAM: ${env:JWT_SSM_PUBLIC_KEY_PARAM, self:custom.jwtSsmParams.public.${sls:stage}}
    ABLY_API_KEY: ${env:ABLY_API_KEY}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'https://app.tiagofuguete.com.br'}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET, ''}
    AWS_S3_REGION: ${env:AWS_S3_REGION, 'us-east-1'}
    EMAIL_USER: ${env:EMAIL_USER, ''}
    EMAIL_PASS: ${env:EMAIL_PASS, ''}
    FRONTEND_URL: ${env:FRONTEND_URL, self:custom.frontendUrl.${sls:stage}}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/championship-mtg/${sls:stage}/jwt-private-key"
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/championship-mtg/${sls:stage}/jwt-public-key"
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - !Sub "arn:aws:s3:::${env:AWS_S3_BUCKET, 'placeholder'}/*"

build:
  esbuild: false

plugins:
  # - serverless-offline

custom:
  frontendUrl:
    dev: https://app.tiagofuguete.com.br
    prod: https://app.tiagofuguete.com.br
  jwtSsmParams:
    private:
      dev: /championship-mtg/dev/jwt-private-key
      prod: /championship-mtg/prod/jwt-private-key
    public:
      dev: /championship-mtg/dev/jwt-public-key
      prod: /championship-mtg/prod/jwt-public-key
  corsOrigins: &corsOrigins
    - ${env:CORS_ORIGIN, 'https://app.tiagofuguete.com.br'}
    - https://app.tiagofuguete.com.br
    - https://www.app.tiagofuguete.com.br
    - https://tiagofuguete.com.br
    - https://www.tiagofuguete.com.br
    - http://localhost:5173
  # serverless-offline:
  #   httpPort: 4000

package:
  patterns:
    - "src/**"
    - "build/**"

functions:
  # Uma única Lambda (um pool Mongo por instância). Paths explícitos —
  # catch-all /{proxy+} quebrou o httpMethod/path no API Gateway + serverless-http.
  api:
    handler: build/handler.handler
    memorySize: 512
    timeout: 29
    events:
      - http:
          path: /usuario
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /usuario/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /deck
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /deck/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /imagem
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /imagem/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /metagame
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /metagame/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /health
          method: get
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /torneio
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /torneio/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /liga
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /liga/{proxy+}
          method: any
          cors:
            origins: *corsOrigins
            methods: [OPTIONS, GET, POST, PUT, PATCH, DELETE]
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true
      - http:
          path: /time
          method: any
