            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: true

outputs:
  usuarioCadastrar:
    Description: "Rota de cadastro de usuários"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/cadastrar"

  usuarioLogin:
    Description: "Rota de login de usuários"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/login"

  usuarioAtualizar:
    Description: "Rota de atualizar dados do usuário"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/atualizar"

  deckCadastrar:
    Description: "Rota de cadastro de decks"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/cadastrar"

  deckListar:
    Description: "Rota de listagem de decks do usuário"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/listar"

  deckAtualizar:
    Description: "Rota de atualizar deck"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/atualizar/{id}"

  deckExcluir:
    Description: "Rota de exclusão de decks"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/deck/excluir/{id}"

  usuarioResetSenhaSolicitar:
    Description: "Rota de solicitação de reset de senha"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/reset-senha/solicitar"

  usuarioResetSenhaConfirmar:
    Description: "Rota de confirmação de reset de senha"
    Value: !Sub "https://${self:service}.execute-api.${aws:region}.amazonaws.com/${sls:stage}/usuario/reset-senha/confirmar"
